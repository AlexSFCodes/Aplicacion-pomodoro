<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styless.css">
    <link rel="icon" type="image/png" href="logo.ico">  <!-- ← AGREGAR ESTA LÍNEA -->
    <title>Pomodoro Timer</title>
</head>
<body>
    <div class="contenedor-padre">
        <h1 class="Titulo">Pomodoro APP</h1>
        
        <div class="timer">
            <span id="minutos">25</span>
            <span>:</span>
            <span id="segundos">00</span>
        </div>
        
        <div id="modo-texto">📘 Tiempo de enfoque - Trabaja</div>
        
        <div class="botones">
            <button id="iniciar">▶ Iniciar</button>
            <button id="pausar">⏸ Pausar</button>
            <button id="reset">🔄 Reset</button>
        </div>
        
        <div class="modos">
            <button class="modo-btn active" data-modo="pomodoro"> Pomodoro</button>
            <button class="modo-btn" data-modo="short"> Descanso corto</button>
            <button class="modo-btn" data-modo="long"> Descanso largo</button>
        </div>
        
        <div class="stats">
             Ciclos completados: <span id="contador">0</span>
        </div>
        
        <div style="margin-top: 15px; text-align: center;">
            <button id="silenciar" class="boton-silenciar">🔊 Silenciar alarma</button>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
